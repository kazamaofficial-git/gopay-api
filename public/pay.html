<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd93d">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/neo.css">
  <meta name="robots" content="noindex">
  <title>Bayar dengan QRIS</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .pay { width: min(440px, 100%); padding: 0; overflow: hidden; background: var(--paper); }
    .pay-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .85rem 1.25rem; background: var(--blue); border-bottom: var(--border); }
    .pay-top .brand { font-size: 1.05rem; }
    .pay-top .brand img { width: 28px; height: 28px; }
    .pay-body { padding: 1.4rem 1.25rem 1.5rem; }
    .amount-label { margin: 0; font-weight: 700; color: var(--muted); font-size: .9rem; }
    .amount { font: 800 clamp(2.4rem, 11vw, 3.2rem)/1.05 var(--font-display); letter-spacing: -.03em; margin: .1rem 0 1.25rem; word-break: break-word; }
    .qr-box { position: relative; background: #fff; border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1rem; width: min(300px, 100%); aspect-ratio: 1; margin: 0 auto 1.4rem; display: grid; place-items: center; }
    .qr-box img { width: 100%; height: 100%; }
    .qr-box .placeholder { font-weight: 800; text-align: center; padding: 1rem; }
    .timer { display: flex; justify-content: space-between; align-items: center; background: #f6f7fa; border: var(--border); border-radius: 12px; padding: .6rem 1rem; font-weight: 700; margin-bottom: .9rem; }
    .timer output { font: 800 1.35rem var(--font-mono); }
    .state { border: var(--border); border-radius: 12px; padding: .8rem 1rem; font-weight: 800; display: flex; align-items: center; gap: .65rem; margin-bottom: .9rem; background: var(--sun); }
    .state .dot { background: var(--ink); }
    .state[data-state="paid"] { background: var(--lime); }
    .state[data-state="expired"], .state[data-state="notfound"] { background: var(--pink); }
    .auto { display: flex; align-items: center; gap: .6rem; margin-top: 1rem; font-weight: 700; font-size: .92rem; cursor: pointer; }
    .auto input { width: 1.2rem; height: 1.2rem; accent-color: var(--ink); }
    .receipt { margin-top: 1rem; border: var(--border); border-radius: 12px; background: #f6f7fa; padding: .9rem 1rem; }
    .receipt dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; font-size: .92rem; }
    .receipt dt { font-weight: 800; } .receipt dd { margin: 0; word-break: break-all; font: 600 .85rem var(--font-mono); }
    .how { margin: 1.25rem 0 0; font-size: .85rem; color: var(--muted); font-weight: 700; text-align: center; max-width: none; }
  </style>
</head>
<body>
  <main class="pay card">
    <div class="pay-top">
      <a class="brand" href="/"><img src="/assets/favicon.svg" alt="" width="28" height="28">GoPay API</a>
      <span class="pill"><span class="dot ok" aria-hidden="true"></span>QRIS</span>
    </div>
    <div class="pay-body">
      <p class="amount-label">Total pembayaran</p>
      <p class="amount" id="amount">Rp -</p>

      <div class="qr-box" id="qr-box"><span class="placeholder">Memuat QR...</span></div>

      <div class="timer"><span>Sisa waktu bayar</span><output id="timer" aria-live="off">05:00</output></div>

      <div class="state" id="state" data-state="pending" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="state-text">Menunggu pembayaran</span>
      </div>

      <button class="btn btn-primary btn-block" id="check" type="button">Cek pembayaran</button>
      <label class="auto"><input type="checkbox" id="auto"> Cek otomatis setiap 8 detik</label>

      <div class="receipt" id="receipt" hidden>
        <dl>
          <dt>Order ID</dt><dd id="r-order">-</dd>
          <dt>Sumber</dt><dd id="r-issuer">-</dd>
          <dt>Waktu</dt><dd id="r-time">-</dd>
        </dl>
      </div>

      <p class="how">Buka GoPay atau e-wallet lain, pilih Scan, lalu arahkan ke kode QR.</p>
    </div>
  </main>
  <script src="/assets/pay.js"></script>
</body>
</html>
